plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Fabric API, Loader and Minecraft libraries resolve through the plugin repositories and Mojang's maven,
    // both added by Loom automatically. Add extra repositories here for optional integrations.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // The mod is written against Mojang's official names (Minecraft, KeyMapping, GuiGraphics, ...).
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // The AI engine is plain Java; its unit tests and headless simulations run on JUnit.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    // Loom pulls in the right Java toolchain for the Minecraft version; 1.21.x needs Java 21.
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
    // Headless simulations can be slow on first JIT; give them room but fail on genuine hangs.
    maxHeapSize = "1G"
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
